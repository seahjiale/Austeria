name: Godot Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6.2
    steps:
      - uses: actions/checkout@v4

      - name: Run GUT tests
        run: |
          godot --headless -s addons/gut/gut_cmdln.gd \
            -gdir=res://test/unit -gexit